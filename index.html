<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon3.ico">
    <link rel="stylesheet" href="estilo.css">

    <title>Contacto</title>
</head>
<body>
    <h3>Formulario</h3>
    <h1>Contacto y opinión</h1>
    <hr>
    <form action="Contacto.html" method="get">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre">

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo">

        <label for="calificacion">Que calificación le da a este sitio web?</label>
        <input type="number" id="calificacion" name="calificacion">

        <label for="tema">Progresión favorita</label>
        <select id="tema" name="tema">
            <option value="p1">Progresión 1: Independencia</option>
            <option value="p2">Progresión 2: Liberalismo</option>
            <option value="p3">Progresión 3: Invasiones</option>
            <option value="p2">Progresión 4: Derechos</option>
            <option value="p3">Progresión 5: Conservadores</option>
        </select>

        <input type="submit" value="Enviar">
    </form>
    <hr>
    <a href="index.html">Volver al inicio</a>
</body>
</html>
